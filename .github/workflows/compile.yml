
name: Compile Pokeemerald Expansion

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Install Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential \
            libpng-dev \
            gcc-arm-none-eabi \
            git

      - name: Compile ROM
        run: make -j$(nproc)

      - name: Upload Finished ROM
        uses: actions/upload-artifact@v4
        with:
          name: compiled-pokeemerald-rom
          path: pokeemerald.gba
          if-no-files-found: error
